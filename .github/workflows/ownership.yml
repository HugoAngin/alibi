name: Ownership audit

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check who changed what
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          case "$BEFORE" in
            *[!0]*) ;;
            *) echo "First push, nothing to compare."; exit 0 ;;
          esac
          status=0
          python3 tools/check_ownership.py --range "$BEFORE..$AFTER" --login "$ACTOR" > report.txt || status=$?
          cat report.txt
          [ "$status" -eq 1 ] || exit "$status"
          lead="$(jq -r '.members[] | select(.role == "lead") | .github' team.json)"
          issue="$(jq -r '.board_issue' team.json)"
          {
            echo "**[BLOCKED]** from \`ci\` to @$ACTOR @$lead"
            echo
            echo "Ownership audit failed on \`${AFTER:0:7}\`. Please undo this and ask the owner on the board."
            echo
            cat report.txt
            echo
            echo "$SERVER/$REPOSITORY/actions/runs/$RUN_ID"
          } > comment.md
          gh issue comment "$issue" --repo "$REPOSITORY" --body-file comment.md
          exit 1
