[project]
name = "winthrutheory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "pytest",
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
    "google-genai>=3.0.0",
    "rfc8785>=0.1.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Lets tests in one agent's folder import another agent's api.py, as agents.<role>.api.
pythonpath = ["."]
